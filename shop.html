<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>فروشگاه — الماس موبایل 💎</title>
<link rel="icon" type="image/png" href="assets/logo-black.png">
<link rel="stylesheet" href="assets/style.css">
<style>
  /* استایل‌های اختصاصی فروشگاه */
  body { font-family: 'Koodak', sans-serif !important; }
  
  .shop-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; position: sticky; top: 0; z-index: 100; background: var(--glass); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-soft); gap: 15px; }
  .header-actions { display: flex; align-items: center; gap: 10px; flex: 1; max-width: 400px; }
  
  .search-box { display: flex; align-items: center; background: var(--card); border: 1px solid var(--border-soft); border-radius: 999px; padding: 8px 15px; flex: 1; transition: border-color 0.2s; }
  .search-box:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-glow); }
  .search-box input { border: none; background: transparent; outline: none; color: var(--fg); font-family: inherit; font-size: 14px; width: 100%; }
  .search-box svg { width: 18px; height: 18px; stroke: var(--muted); }

  .cart-btn { position: relative; background: var(--card); border: 1px solid var(--border-soft); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s, border-color 0.2s; color: var(--fg); }
  .cart-btn:hover { transform: scale(1.05); border-color: var(--brand); }
  .cart-badge { position: absolute; top: -5px; right: -5px; background: var(--brand); color: #fff; font-size: 12px; font-weight: bold; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

  .hero-slider { position: relative; width: 100%; height: 200px; overflow: hidden; border-radius: 0 0 var(--radius) var(--radius); background: var(--card); margin-bottom: 20px; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 50px rgba(0,0,0,0.05); }
  .slide-content { text-align: center; padding: 20px; animation: fadeUp 0.8s ease; }
  .slide-content h2 { font-size: 24px; margin: 0 0 10px; font-weight: 900; color: var(--fg); }
  .slide-content p { font-size: 14px; color: var(--muted); margin: 0; }

  .category-nav { padding: 10px 20px; display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--border-soft); background: var(--bg); position: sticky; top: 75px; z-index: 90; }
  .category-nav::-webkit-scrollbar { display: none; }
  .category-btn { white-space: nowrap; background: var(--card); border: 1px solid var(--border-soft); padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.2s; color: var(--fg); }
  .category-btn.active { background: var(--brand); color: #fff; border-color: var(--brand); }

  .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; padding: 20px; }
  .product-card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border-soft); overflow: hidden; display: flex; flex-direction: column; transition: transform 0.3s, box-shadow 0.3s; cursor: pointer; position: relative; }
  .product-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px -10px rgba(0, 113, 227, 0.2); border-color: var(--brand); }
  .product-img { width: 100%; height: 150px; object-fit: contain; background: #fff; padding: 15px; mix-blend-mode: multiply; }
  .product-info { padding: 12px; display: flex; flex-direction: column; flex: 1; }
  .product-title { font-weight: 800; font-size: 14px; margin-bottom: 5px; }
  .product-price { color: var(--brand); font-weight: 900; font-size: 16px; margin-top: auto; }
  .add-to-cart-btn { background: var(--accent); color: var(--bg); border: none; padding: 10px; border-radius: var(--radius-sm); font-family: inherit; font-weight: bold; margin-top: 10px; cursor: pointer; transition: background 0.2s; }
  .add-to-cart-btn:hover { background: var(--brand); color: #fff; }

  .cart-drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 9999; opacity: 0; visibility: hidden; transition: all 0.3s; }
  .cart-drawer-overlay.open { opacity: 1; visibility: visible; }
  .cart-drawer { position: fixed; top: 0; left: 0; width: 100%; max-width: 400px; height: 100%; background: var(--bg); z-index: 10000; transform: translateX(-100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; }
  .cart-drawer.open { transform: translateX(0); }
  .cart-header { padding: 20px; border-bottom: 1px solid var(--border-soft); display: flex; justify-content: space-between; align-items: center; }
  .cart-items { flex: 1; overflow-y: auto; padding: 20px; }
  .cart-footer { padding: 20px; border-top: 1px solid var(--border-soft); }
  .cart-total { display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; margin-bottom: 15px; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<header class="shop-header">
  <a href="index.html" class="brand">
    <img src="assets/logo-black.png" alt="الماس" class="logo-light" style="height:35px">
    <img src="assets/logo-white.png" alt="الماس" class="logo-dark" style="height:35px">
  </a>
  
  <div class="header-actions">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="search-input" placeholder="جستجوی محصول...">
    </div>
  </div>

  <button class="cart-btn" id="open-cart-btn">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    <span class="cart-badge" id="cart-badge">0</span>
  </button>
</header>

<main class="container" style="padding: 0 0 80px 0;">
  
  <div class="hero-slider">
    <div class="slide-content">
      <h2>جدیدترین گوشی‌های اپل</h2>
      <p>با گارانتی الماس موبایل و بهترین قیمت</p>
    </div>
  </div>

  <div class="category-nav" id="category-nav">
    <button class="category-btn active" data-category="all">همه محصولات</button>
    <button class="category-btn" data-category="mobile">موبایل</button>
    <button class="category-btn" data-category="accessories">لوازم جانبی</button>
  </div>

  <div class="products-grid" id="products-grid"></div>
</main>

<div class="cart-drawer-overlay" id="cart-overlay"></div>
<div class="cart-drawer" id="cart-drawer">
  <div class="cart-header">
    <h2 style="margin: 0; font-size: 18px;">سبد خرید</h2>
    <button id="close-cart-btn" style="background:none; border:none; font-size:28px; cursor:pointer; color:var(--fg);">×</button>
  </div>
  <div class="cart-items" id="cart-items"></div>
  <div class="cart-footer">
    <div class="cart-total"><span>مجموع:</span><span id="cart-total-price">۰ تومان</span></div>
    <button class="btn" id="checkout-btn" style="margin-bottom:10px;">ادامه و ثبت سفارش</button>
    <a href="cart.html" class="btn btn-secondary" style="display:block; text-align:center; text-decoration:none;">مشاهده صفحه سبد خرید</a>
  </div>
</div>

<script>
  // دیتابیس محصولات با عکس‌های تضمینی
  const mockProducts = [
    { id: 1, name: 'آیفون ۱۵ پرو مکس ۲۵۶', price: 128900000, category: 'mobile', image: 'https://fdn2.gsmarena.com/vv/pics/apple/apple-iphone-15-pro-max-1.jpg' },
    { id: 2, name: 'آیفون ۱۳ ۱۲۸', price: 203000000, category: 'mobile', image: 'https://fdn2.gsmarena.com/vv/pics/apple/apple-iphone-13-01.jpg' },
    { id: 3, name: 'سامسونگ S24 اولترا', price: 398500000, category: 'mobile', image: 'https://fdn2.gsmarena.com/vv/pics/samsung/samsung-galaxy-s24-ultra-5g-1.jpg' },
    { id: 4, name: 'ایرپاد پرو ۲', price: 54900000, category: 'accessories', image: 'https://fdn2.gsmarena.com/vv/pics/apple/apple-airpods-pro-2-1.jpg' }
  ];

  const productsGrid = document.getElementById('products-grid');
  const cartBadge = document.getElementById('cart-badge');
  const cartItemsContainer = document.getElementById('cart-items');
  const cartTotalPrice = document.getElementById('cart-total-price');
  const cartDrawer = document.getElementById('cart-drawer');
  const cartOverlay = document.getElementById('cart-overlay');
  const searchInput = document.getElementById('search-input');
  
  let cart = JSON.parse(localStorage.getItem('almas_cart')) || [];
  let currentCategory = 'all';
  let currentSearch = '';

  const formatToman = (n) => Number(n).toLocaleString('fa-IR') + ' تومان';

  function renderProducts() {
    productsGrid.innerHTML = '';
    const filtered = mockProducts.filter(p => {
      const matchCategory = currentCategory === 'all' || p.category === currentCategory;
      const matchSearch = p.name.includes(currentSearch);
      return matchCategory && matchSearch;
    });
    
    if (filtered.length === 0) {
      productsGrid.innerHTML = '<p style="text-align:center; width:100%; color:var(--muted);">محصولی یافت نشد.</p>';
      return;
    }

    filtered.forEach(p => {
      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <img src="${p.image}" alt="${p.name}" class="product-img" onerror="this.src='assets/logo-black.png'; this.style.opacity='0.3';">
        <div class="product-info">
          <div class="product-title">${p.name}</div>
          <div class="product-price">${formatToman(p.price)}</div>
          <button class="add-to-cart-btn" data-id="${p.id}">افزودن به سبد</button>
        </div>
      `;
      
      // لینک رفتن به صفحه محصول
      card.addEventListener('click', (e) => {
        if (!e.target.classList.contains('add-to-cart-btn')) {
          window.location.href = 'product.html?id=' + p.id;
        }
      });
      
      productsGrid.appendChild(card);
    });
  }

  searchInput.addEventListener('input', (e) => {
    currentSearch = e.target.value.trim();
    renderProducts();
  });

  document.getElementById('category-nav').addEventListener('click', (e) => {
    if (e.target.classList.contains('category-btn')) {
      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentCategory = e.target.dataset.category;
      renderProducts();
    }
  });

  productsGrid.addEventListener('click', (e) => {
    if (e.target.classList.contains('add-to-cart-btn')) {
      e.stopPropagation();
      const id = Number(e.target.dataset.id);
      const product = mockProducts.find(p => p.id === id);
      if (!cart.find(item => item.id === id)) {
        cart.push({ ...product, qty: 1 });
        localStorage.setItem('almas_cart', JSON.stringify(cart));
        updateCartUI();
        showToast('محصول به سبد اضافه شد ✅');
      } else {
        showToast('این محصول در سبد موجود است', true);
      }
    }
  });

  function updateCartUI() {
    cartBadge.textContent = cart.length;
    cartItemsContainer.innerHTML = '';
    let total = 0;
    if (cart.length === 0) {
      cartItemsContainer.innerHTML = '<p style="text-align:center; color:var(--muted); margin-top:50px;">سبد شما خالی است.</p>';
    } else {
      cart.forEach(item => {
        total += item.price;
        const el = document.createElement('div');
        el.className = 'cart-item';
        el.style = 'display:flex; align-items:center; gap:10px; margin-bottom:15px; background:var(--card); padding:10px; border-radius:var(--radius-sm);';
        el.innerHTML = `
          <img src="${item.image}" style="width:50px; height:50px; object-fit:contain; background:#fff; border-radius:8px;">
          <div style="flex:1;">
            <div style="font-size:13px; font-weight:bold;">${item.name}</div>
            <div style="font-size:12px; color:var(--brand); font-weight:bold;">${formatToman(item.price)}</div>
          </div>
          <button style="background:none; border:none; color:var(--danger); font-size:24px; cursor:pointer;" onclick="removeFromCart(${item.id})">×</button>
        `;
        cartItemsContainer.appendChild(el);
      });
    }
    cartTotalPrice.textContent = formatToman(total);
  }

  window.removeFromCart = (id) => {
    cart = cart.filter(item => item.id !== id);
    localStorage.setItem('almas_cart', JSON.stringify(cart));
    updateCartUI();
    showToast('حذف شد');
  };

  document.getElementById('open-cart-btn').addEventListener('click', () => {
    cartDrawer.classList.add('open'); cartOverlay.classList.add('open');
  });
  document.getElementById('close-cart-btn').addEventListener('click', () => {
    cartDrawer.classList.remove('open'); cartOverlay.classList.remove('open');
  });
  cartOverlay.addEventListener('click', () => {
    cartDrawer.classList.remove('open'); cartOverlay.classList.remove('open');
  });

  document.getElementById('checkout-btn').addEventListener('click', () => {
    if (cart.length === 0) return showToast('سبد خرید شما خالی است', true);
    window.location.href = 'cart.html'; 
  });

  document.addEventListener('DOMContentLoaded', () => {
    renderProducts();
    updateCartUI();
  });
</script>
<script src="assets/app.js"></script>
</body>
</html>
